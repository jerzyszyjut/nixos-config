# Which keys can decrypt which files.
#
# Two keys are listed for every secret:
#   - your personal key, so YOU can edit secrets on any machine
#   - the host key, so the MACHINE can decrypt them at boot
#
# Both must be filled in before `sops secrets/secrets.yaml` will work.
# docs/SECRETS.md walks through generating them.

keys:
  # Your personal age key. Get the public half with:
  #   age-keygen -o ~/.config/sops/age/keys.txt      (first time only)
  #   age-keygen -y ~/.config/sops/age/keys.txt
  - &admin_jerzy age1vh33ghtx0rcn9c6meflzcaqud8q2zmme52sfcs54fzsa245jgcwslp0gwx 

  # Derived from the machine's SSH host key, which only exists after the first
  # boot. Get it with:
  #   nix-shell -p ssh-to-age --run 'ssh-to-age < /etc/ssh/ssh_host_ed25519_key.pub'
  - &host_thinkpad age1cemn3mqr2xt7u645djpx5m94j9jjfdzfq0lldk78w09jn7c4pvxqwngtgp

  # kino's key. NOT derived from its SSH host key, unlike the comment above
  # suggests: modules/nixos/secrets.nix uses `age.keyFile` with
  # `generateKey = true`, so the machine's identity is the age key at
  # /var/lib/sops-nix/key.txt and nothing else. Generated before kino's first
  # boot and placed there directly, because the activation script that would
  # have generated it is the same one that needs to decrypt with it.
  - &host_kino age10aetd0a545dh7dn2sj8253u2gxw4jzkkj4mcpl55sjh6ghwx0s5q29gl4z

creation_rules:
  - path_regex: secrets/[^/]+\.yaml$
    key_groups:
      - age:
          - *admin_jerzy
          - *host_thinkpad
          - *host_kino
