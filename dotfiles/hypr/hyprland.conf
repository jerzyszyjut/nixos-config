# Starter config. Edit freely — this file is symlinked, not copied into the
# Nix store, so changes take effect on reload with no rebuild.
# Reload: hyprctl reload

# Default is EXTEND, not mirror. The `auto-*` keywords tell Hyprland where to
# put each output relative to the ones already laid out, so an external screen
# becomes extra desktop instead of a copy of the laptop panel — and it does
# so without this file knowing the connector name in advance. DP-1 has a named
# rule below that stacks it above the laptop; anything else lands to the right.
monitor = eDP-1, preferred, 0x0, 1

# The Samsung Odyssey G70D (27" 4K) over DisplayPort. Native 3840x2160 at
# scale 1.5 gives 2560x1440 of usable space at laptop-matched text size —
# the integer-ish ratio Hyprland handles cleanly, unlike 1.25 or 1.75 which
# leave fractional buffers and blurry XWayland windows.
#
#   scale 1    -> 3840x2160 logical, very small text, maximum room
#   scale 2    -> 1920x1080 logical, large text
#
# This panel also advertises 2560x1440@120. If you would rather have the
# refresh rate than the pixels, swap the mode line for:
#   monitor = DP-1, 2560x1440@120, auto-up, 1
#
# Placement is `auto-up`, not `auto-right`: the screen sits physically above
# the laptop panel, so the cursor crosses between them by running off the top
# edge rather than sideways. Hyprland resolves this to 0x-1440 — left edges
# aligned, the external's 1440 logical rows stacked directly on top.
#
# Left-aligned means the external is 2560 logical wide against the laptop's
# 1920, so its rightmost 640 columns have nothing beneath them and the cursor
# only drops back down under that shared 1920. Centre the two instead with an
# explicit position if that ever gets annoying:
#   monitor = DP-1, 3840x2160@60, -320x-1440, 1.5
monitor = DP-1, 3840x2160@60, auto-up, 1.5

# Anything else that gets plugged in: native mode, extended to the right.
monitor = , preferred, auto-right, 1

# `hyprctl monitors` prints the resolution, position and scale of every
# output as Hyprland actually resolved it — the way to check a new screen
# landed where you meant it to.
#
# To try a layout for one session without touching this file:
#   hyprctl keyword monitor "DP-1,2560x1440@120,auto-right,1"
# and to go back to what is written here:
#   hyprctl reload
#
# To mirror deliberately — a projector in a lecture hall, say:
#   hyprctl keyword monitor "DP-1,preferred,auto,1,mirror,eDP-1"

# ---------------------------------------------------------------------------
# WORKSPACES -> OUTPUTS
# ---------------------------------------------------------------------------
# Without these rules a workspace belongs to whichever output happened to
# create it, which is why $mod+2 could yank focus to the external screen at
# random: Hyprland had handed DP-1 the first free number when it came up.
# Pinning the ranges makes the number keys mean a fixed place — 1-5 is always
# the laptop panel, 6-9 is always the big screen — and pressing one moves
# focus to the right output on its own.
#
# `default:true` is the workspace an output opens on when it connects; exactly
# one per monitor. When DP-1 is unplugged, 6-9 fall back onto the laptop and
# come home again on replug — no rule change needed for going mobile.
workspace = 1, monitor:eDP-1, default:true
workspace = 2, monitor:eDP-1
workspace = 3, monitor:eDP-1
workspace = 4, monitor:eDP-1
workspace = 5, monitor:eDP-1
workspace = 6, monitor:DP-1, default:true
workspace = 7, monitor:DP-1
workspace = 8, monitor:DP-1
workspace = 9, monitor:DP-1

# ---------------------------------------------------------------------------
# THE AESTHETIC SECTION — this is the part to play with
# ---------------------------------------------------------------------------
# Colours come from Stylix, which writes $base0X variables into scope.
# Everything below is geometry and motion, which Stylix does not touch.

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2

    # Sharper, denser alternative — zero wasted screen on a 14" panel:
    #   gaps_in = 0
    #   gaps_out = 0
    #   border_size = 1

    col.active_border = rgba(7daea3ff) rgba(a9b665ff) 45deg
    col.inactive_border = rgba(45403daa)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 8

    # BLUR IS OFF ON PURPOSE.
    # On Meteor Lake integrated graphics it costs real battery and can stutter
    # when dragging windows. Turn it on if you decide you want the glass look.
    blur {
        enabled = false
        size = 6
        passes = 2
        new_optimizations = true
    }

    shadow {
        enabled = false
    }

    active_opacity = 1.0
    inactive_opacity = 1.0
}

animations {
    enabled = true

    # Snappy. Feels responsive rather than cinematic — around 150ms total.
    bezier = snap, 0.05, 0.9, 0.1, 1.0
    animation = windows, 1, 3, snap, popin 80%
    animation = windowsOut, 1, 3, snap, popin 80%
    animation = border, 1, 5, default
    animation = fade, 1, 3, snap
    animation = workspaces, 1, 3, snap, slide

    # Cinematic alternative — replace the durations above with 7-8 and use:
    #   bezier = smooth, 0.16, 1, 0.3, 1
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
}

input {
    kb_layout = pl
    kb_model = pc105
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        disable_while_typing = true
        clickfinger_behavior = true
        tap-to-click = true
    }
    sensitivity = 0
}


# ---------------------------------------------------------------------------
# AUTOSTART
# ---------------------------------------------------------------------------
exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = hyprpaper -c ~/.config/hypr-stylix/hyprpaper.conf
exec-once = systemctl --user start hyprpolkitagent
exec-once = wl-paste --watch cliphist store

# ---------------------------------------------------------------------------
# KEYBINDS
# ---------------------------------------------------------------------------
$mod = SUPER
$term = kitty
$menu = fuzzel

bind = $mod, Return, exec, $term
bind = $mod, D, exec, $menu
bind = $mod, Q, killactive
bind = $mod SHIFT, Q, exit
bind = $mod, E, exec, $term -e yazi
bind = $mod, W, exec, firefox

# Lock lives on mod+Escape so that mod+L stays free for vim-style focus.
# Escape is also easier to hit blind than a letter when you're walking away.
bind = $mod, Escape, exec, hyprlock

# clipboard history — no mouse needed
bind = $mod, V, exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy

# screenshots. -m active needs no pointer at all; region select does.
bind = , Print, exec, hyprshot -m window -m active --clipboard-only
bind = SHIFT, Print, exec, hyprshot -m region --clipboard-only

# focus
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r

# move windows
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r

bind = $mod, F, fullscreen, 0
bind = $mod, T, togglefloating
bind = $mod, P, pseudo

# workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

# monitors. Workspaces belong to the output they were opened on, so with a
# second screen attached `$mod 1-5` alone can only ever reach one of them.
# These two cross the gap: cycle focus, and throw the current window over.
bind = $mod, Tab, focusmonitor, +1
bind = $mod SHIFT, Tab, movewindow, mon:+1

# hardware keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl s 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 5%-
bindl  = , XF86AudioPlay, exec, playerctl play-pause

# mouse, for when you want it
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Keybind sanity check: `hyprctl binds` lists every binding as Hyprland
# actually parsed it. If you ever bind the same key twice, the later line wins
# silently — this command is how you catch it.
