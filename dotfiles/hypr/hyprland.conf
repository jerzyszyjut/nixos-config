# Starter config. Edit freely — this file is symlinked, not copied into the
# Nix store, so changes take effect on reload with no rebuild.
# Reload: hyprctl reload

monitor = , preferred, auto, 1

# ---------------------------------------------------------------------------
# THE AESTHETIC SECTION — this is the part to play with
# ---------------------------------------------------------------------------
# Colours come from Stylix, which writes $base0X variables into scope.
# Everything below is geometry and motion, which Stylix does not touch.

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2

    # Sharper, denser alternative — zero wasted screen on a 14" panel:
    #   gaps_in = 0
    #   gaps_out = 0
    #   border_size = 1

    col.active_border = rgba(7daea3ff) rgba(a9b665ff) 45deg
    col.inactive_border = rgba(45403daa)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 8

    # BLUR IS OFF ON PURPOSE.
    # On Meteor Lake integrated graphics it costs real battery and can stutter
    # when dragging windows. Turn it on if you decide you want the glass look.
    blur {
        enabled = false
        size = 6
        passes = 2
        new_optimizations = true
    }

    shadow {
        enabled = false
    }

    active_opacity = 1.0
    inactive_opacity = 1.0
}

animations {
    enabled = true

    # Snappy. Feels responsive rather than cinematic — around 150ms total.
    bezier = snap, 0.05, 0.9, 0.1, 1.0
    animation = windows, 1, 3, snap, popin 80%
    animation = windowsOut, 1, 3, snap, popin 80%
    animation = border, 1, 5, default
    animation = fade, 1, 3, snap
    animation = workspaces, 1, 3, snap, slide

    # Cinematic alternative — replace the durations above with 7-8 and use:
    #   bezier = smooth, 0.16, 1, 0.3, 1
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
}

input {
    kb_layout = pl
    kb_model = pc105
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        disable_while_typing = true
        clickfinger_behavior = true
        tap-to-click = true
    }
    sensitivity = 0
}


# ---------------------------------------------------------------------------
# AUTOSTART
# ---------------------------------------------------------------------------
exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = hyprpaper
exec-once = systemctl --user start hyprpolkitagent
exec-once = wl-paste --watch cliphist store

# ---------------------------------------------------------------------------
# KEYBINDS
# ---------------------------------------------------------------------------
$mod = SUPER
$term = kitty
$menu = fuzzel

bind = $mod, Return, exec, $term
bind = $mod, D, exec, $menu
bind = $mod, Q, killactive
bind = $mod SHIFT, Q, exit
bind = $mod, E, exec, $term -e yazi
bind = $mod, W, exec, firefox

# Lock lives on mod+Escape so that mod+L stays free for vim-style focus.
# Escape is also easier to hit blind than a letter when you're walking away.
bind = $mod, Escape, exec, hyprlock

# clipboard history — no mouse needed
bind = $mod, V, exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy

# screenshots. -m active needs no pointer at all; region select does.
bind = , Print, exec, hyprshot -m window -m active --clipboard-only
bind = SHIFT, Print, exec, hyprshot -m region --clipboard-only

# focus
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r

# move windows
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r

bind = $mod, F, fullscreen, 0
bind = $mod, T, togglefloating
bind = $mod, P, pseudo

# workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

# hardware keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl s 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 5%-
bindl  = , XF86AudioPlay, exec, playerctl play-pause

# mouse, for when you want it
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Keybind sanity check: `hyprctl binds` lists every binding as Hyprland
# actually parsed it. If you ever bind the same key twice, the later line wins
# silently — this command is how you catch it.
